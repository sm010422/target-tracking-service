name: Deploy target-tracking-service

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: ✅ Unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # excludeTags 'integration'(build.gradle)로 Postgres/Kafka/Redis 실연결이
      # 필요한 TargetTrackingApplicationTests는 여기서 자동으로 제외됨.
      - name: Run unit tests
        run: ./gradlew test --no-daemon

  build-and-push:
    name: 🧪 Build target-tracking-service
    needs: test
    runs-on: ubuntu-24.04-arm
    outputs:
      image_tag: ${{ steps.meta.outputs.sha }}
    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set image tag
        id: meta
        run: echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/target-tracking-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/target-tracking-service:latest
