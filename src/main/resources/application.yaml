spring:
  application:
    name: TargetTracking

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:PLACEHOLDER}
        chat:
          options:
            model: gemini-flash-lite-latest
        embedding:
          api-key: ${GEMINI_API_KEY:PLACEHOLDER}
          text:
            options:
              model: gemini-embedding-001
              dimensions: 1536
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

  datasource:
    url: jdbc:postgresql://localhost:5432/defense_db
    username: defense
    password: defense_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms

  output:
    ansi:
      enabled: ALWAYS

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: target-tracking-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  exception-conversion-word: "%wEx{0}"

server:
  port: 8080

# opendata.adsb.fi 공개 ADS-B 피드 폴링 (AdsbFiPollingService). 개인/비상업적 용도로만
# 이용 가능 -- https://adsb.fi 이용약관 참고, 대시보드/README에 출처 표시 필요.
#
# 중심 좌표 프리셋 (필요시 center-lat/center-lon/radius-nm만 바꿔서 다른 지역 감시):
#   서울/수도권(기본값)        : 37.5665, 126.9780, radius 100nm
#   우크라이나(키이우 인근)     : 50.4501, 30.5234, radius 150nm
#   이란(테헤란 인근)          : 35.6892, 51.3890, radius 150nm
adsb:
  enabled: ${ADSB_ENABLED:false}
  center-lat: ${ADSB_CENTER_LAT:37.5665}
  center-lon: ${ADSB_CENTER_LON:126.9780}
  radius-nm: ${ADSB_RADIUS_NM:100}
  poll-interval-ms: ${ADSB_POLL_INTERVAL_MS:20000}

# Kafka로 표적이 들어올 때마다(군용기/HIGH 이상 규칙등급) 백그라운드에서 자동으로
# Gemini를 호출하던 기능. 무료 tier 일일 임베딩 한도(1000건)를 이 자동호출만으로
# 다 써버리는 걸 실측으로 확인해서 기본값을 꺼둔다 -- 이제 Gemini는 사용자가
# 대시보드에서 "AI 위협분석" 버튼을 눌렀을 때(수동 REST 호출)만 소모된다.
# 데모/유료 tier 전환 시엔 true로 켜면 됨(ThreatAnalysisService 참고).
ai:
  auto-analysis:
    enabled: ${AI_AUTO_ANALYSIS_ENABLED:false}
